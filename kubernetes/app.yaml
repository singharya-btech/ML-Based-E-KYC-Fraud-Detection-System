apiVersion: v1
kind: ConfigMap
metadata:
  name: ekyc-app-config
  namespace: ekyc
data:
  DIGIO_ENV: "sandbox"
  DIGIO_TEMPLATE_PAN: "replace-with-your-digistudio-pan-template-name"
  DIGIO_TEMPLATE_AADHAAR: "replace-with-your-digistudio-aadhaar-template-name"
  API_DOCS_ENABLED: "false"
  KYC_API_URL: "http://backend:8000"
  KYC_SESSION_DB_PATH: "/app/data/kyc_sessions.sqlite3"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ekyc-session-data
  namespace: ekyc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Deployment
metadata:
  name: backend
  namespace: ekyc
  labels:
    app.kubernetes.io/name: ekyc-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ekyc-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ekyc-backend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ekyc-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: API_DOCS_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: ekyc-app-config
                  key: API_DOCS_ENABLED
            - name: DIGIO_ENV
              valueFrom:
                configMapKeyRef:
                  name: ekyc-app-config
                  key: DIGIO_ENV
            - name: KYC_SESSION_DB_PATH
              valueFrom:
                configMapKeyRef:
                  name: ekyc-app-config
                  key: KYC_SESSION_DB_PATH
            - name: APP_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ekyc-secrets
                  key: APP_API_TOKEN
            - name: DIGIO_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: ekyc-secrets
                  key: DIGIO_CLIENT_ID
            - name: DIGIO_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: ekyc-secrets
                  key: DIGIO_CLIENT_SECRET
            - name: DIGIO_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: ekyc-secrets
                  key: DIGIO_WEBHOOK_SECRET
            - name: DIGIO_TEMPLATE_PAN
              valueFrom:
                configMapKeyRef:
                  name: ekyc-app-config
                  key: DIGIO_TEMPLATE_PAN
            - name: DIGIO_TEMPLATE_AADHAAR
              valueFrom:
                configMapKeyRef:
                  name: ekyc-app-config
                  key: DIGIO_TEMPLATE_AADHAAR
          volumeMounts:
            - name: session-data
              mountPath: /app/data
            - name: logs
              mountPath: /app/logs
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 750m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
      volumes:
        - name: session-data
          persistentVolumeClaim:
            claimName: ekyc-session-data
        - name: logs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: ekyc
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ekyc-backend
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: ekyc
  labels:
    app.kubernetes.io/name: ekyc-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ekyc-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ekyc-frontend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: streamlit
          image: ekyc-frontend:local
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "streamlit"]
          args:
            - run
            - app.py
            - --server.address=0.0.0.0
            - --server.port=8501
            - --server.headless=true
            - --browser.gatherUsageStats=false
          ports:
            - name: http
              containerPort: 8501
          env:
            - name: KYC_API_URL
              valueFrom:
                configMapKeyRef:
                  name: ekyc-app-config
                  key: KYC_API_URL
            - name: APP_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ekyc-secrets
                  key: APP_API_TOKEN
          volumeMounts:
            - name: logs
              mountPath: /app/logs
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 750m
              memory: 768Mi
          startupProbe:
            httpGet:
              path: /_stcore/health
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: http
            periodSeconds: 20
      volumes:
        - name: logs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: ekyc
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ekyc-frontend
  ports:
    - name: http
      port: 8501
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ekyc
  namespace: ekyc
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - kyc.example.com
      secretName: ekyc-tls
  rules:
    - host: kyc.example.com
      http:
        paths:
          - path: /api/kyc/webhooks/digio
            pathType: Exact
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 8501
